name: BFL Live Monitor

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions' shortest supported scheduled interval is 5 minutes.
    # Offset to minute 2 to reduce top-of-hour congestion.
    - cron: '2/5 * * * *'

permissions:
  contents: write

concurrency:
  group: bfl-live-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run live monitor
        run: node monitor/live-monitor.js

      - name: Commit live status cache
        run: |
          git config user.name "bfl-live-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-status.json
          if git diff --cached --quiet; then
            echo "No status changes."
          else
            git commit -m "chore: update live status"
            git push
          fi
