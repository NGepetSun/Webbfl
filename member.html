<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1021">
  <title>DATA MEMBER — MAPENDOS FOR LIFE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="member.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span>MAPENDOS</span> FOR LIFE</a>
    <nav>
      <a href="index.html">HOME</a>
      <a class="active" href="member.html">MEMBER</a>
      <a href="index.html#live">LIVE</a>
      <a href="index.html#gallery">GALLERY</a>
      <a href="index.html#history">HISTORY</a>
    </nav>
    <button class="menu" aria-label="Menu"><i></i><i></i><i></i></button>
  </header>

  <main class="member-page">
    <section class="member-hero">
      <div>
        <div class="kicker">MANAGEMENT ANGGOTA</div>
        <h1>DATA <b>MEMBER</b></h1>
        <p>// database anggota MFL</p>
      </div>
      <div class="hero-side">
        <strong><em id="heroActive">118</em> Aktif</strong>
        <small><span id="heroRest">4</span> Rehat</small>
        <a class="recruit" href="#roster">+ REKRUT</a>
      </div>
    </section>

    <section class="member-tabs">
      <div class="tab active"><span class="dot"></span> MEMBER</div>
    </section>

    <section class="stats">
      <div><small>TOTAL ANGGOTA</small><strong id="total">122</strong></div>
      <div><small>AKTIF</small><strong class="green" id="active">118</strong></div>
      <div><small>REHAT</small><strong class="gold" id="rest">4</strong></div>
      <div class="progress-stat">
        <div class="progress-head"><small>RASIO AKTIF</small><b id="ratio">97%</b></div>
        <div class="progress"><span id="progress"></span></div>
      </div>
    </section>

    <section class="filters">
      <label class="search">
        <span>⌕</span>
        <input id="search" type="search" placeholder="Cari nama member..." autocomplete="off">
      </label>
      <select id="division">
        <option value="all">Semua Jabatan</option>
        <option value="commander">COMMANDER</option>
        <option value="under">UNDER OG</option>
        <option value="business">PJ BISNIS</option>
        <option value="member">MEMBER</option>
      </select>
      <select id="status">
        <option value="all">Semua Status</option>
        <option value="active">AKTIF</option>
        <option value="rest">REHAT</option>
      </select>
    </section>

    <section id="roster" class="roster">
      <div class="roster-head">
        <span>◆ ROSTER ANGGOTA</span>
        <small>Menampilkan <b id="shown">122</b> dari 122 member</small>
      </div>
      <div id="groups"></div>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <script src="member.js"></script>
</body>
</html>
