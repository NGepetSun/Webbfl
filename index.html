<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#21134f">
  <meta name="description" content="MAPENDOS FOR LIFE — official home.">
  <title>MAPENDOS FOR LIFE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="MAPENDOS FOR LIFE home">
        <span>MAPENDOS</span> FOR LIFE
      </a>
      <nav class="nav" aria-label="Main navigation">
        <a class="active" href="#home">HOME</a>
        <a href="member.html">MEMBER</a>
        <a href="#live">LIVE</a>
        <a href="#gallery">GALLERY</a>
        <a href="#history">HISTORY</a>
      </nav>
      <button class="menu" aria-label="Open menu"><span></span><span></span><span></span></button>
    </header>

    <main id="home" class="hero">
      <div class="ambient ambient-a"></div>
      <div class="ambient ambient-b"></div>

      <div class="particle-field" aria-hidden="true">
        <div class="particle-layer p1"></div>
        <div class="particle-layer p2"></div>
        <div class="particle-layer p3"></div>
      </div>

      <div class="hero-content">
        <div class="identity">
          <div class="logo-wrap">
            <img src="assets/logo.png" alt="Brother For Life / MAPENDOS emblem" class="logo">
          </div>
          <div class="copy">
            <div class="eyebrow"><span>MAPENDOS</span> FOR LIFE</div>
            <div class="actions">
              <a class="action discord" href="https://discord.gg/qdPSJPzVeq" target="_blank" rel="noopener noreferrer" data-action="discord">
                <span class="icon">◈</span>
                <span>JOIN DISCORD</span>
              </a>
              <a class="action live" href="#" data-action="live">
                <span class="youtube">▶</span>
                <span>LIVE STREAM</span>
              </a>
            </div>
          </div>
        </div>
      </div>

      <div class="scroll-cue" aria-hidden="true">
        <span>SCROLL</span><i></i>
      </div>
    </main>

        <section id="live" class="placeholder"><span>LIVE</span></section>
    <section id="gallery" class="placeholder"><span>GALLERY</span></section>
    <section id="history" class="placeholder"><span>HISTORY</span></section>
  </div>

  <div class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
